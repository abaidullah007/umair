<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#111;--mu:#5c5c5c;--gd:#b8902f;--gl:#f7f0dc;--cd:#fff;--bd:#ececec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff;--tx:#111}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.65 Poppins,Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%}
.w{max-width:1080px;margin:0 auto;padding:0 20px}section{padding:72px 0}
h1,h2,h3{line-height:1.2;margin:0 0 12px}h2{font-size:clamp(1.4rem,3vw,2rem);letter-spacing:.02em;text-align:center}
.sub{color:var(--mu);text-align:center;max-width:620px;margin:0 auto 32px}
header{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em}.lg img{height:38px;width:38px;object-fit:contain}
.mn{display:flex;gap:22px;font-size:.88rem}.mn a{color:var(--mu);transition:color .2s}.mn a:hover{color:var(--gd)}
#hb{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer}
.btn{display:inline-block;padding:11px 24px;border-radius:999px;border:1.5px solid var(--tx);font-weight:500;font-size:.92rem;cursor:pointer;background:#fff;transition:.25s}
.btn:hover{border-color:var(--gd);color:var(--gd);transform:translateY(-2px)}
.gold{background:var(--gd);border-color:var(--gd);color:#fff}.gold:hover{background:#9c7824;color:#fff}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,3.8rem);letter-spacing:.04em}.hero h2{text-align:left;font-size:1.3rem;color:var(--gd);font-weight:600}
.pf{aspect-ratio:1;border-radius:24px;background:var(--gl);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 12px 40px #b8902f26}
.pf img{width:100%;height:100%;object-fit:cover}.pf span{color:var(--gd);font-size:.85rem;padding:20px;text-align:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 2px 12px #0000000a;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--gd);box-shadow:0 10px 26px #b8902f22}
.card svg{width:28px;height:28px;stroke:var(--gd);fill:none;stroke-width:1.6}.card h3{font-size:1rem;margin-top:10px}.card p{color:var(--mu);font-size:.88rem;margin:0}
.soc{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.so{display:flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid var(--bd);border-radius:999px;font-size:.9rem;transition:.25s;background:#fff}
.so:hover{border-color:var(--gd);color:var(--gd);transform:translateY(-3px)}.so svg{width:22px;height:22px}
.band{background:var(--gl);border-radius:24px;padding:48px 24px;text-align:center}
.band p{max-width:620px;margin:0 auto 22px;color:#444}.band img{max-width:100%;border-radius:16px;margin-bottom:20px}
.vd{overflow:hidden;padding:0}.th{aspect-ratio:16/9;background:var(--gl);display:flex;align-items:center;justify-content:center;color:var(--gd);font-size:2rem}.th img{width:100%;height:100%;object-fit:cover}.vd h3{padding:12px 16px;font-size:.92rem;margin:0}
.ab{display:grid;grid-template-columns:1fr 1.5fr;gap:36px;align-items:center}
form{display:grid;gap:10px;max-width:520px;margin:24px auto 0}input,textarea,select{font:inherit;padding:10px 14px;border:1px solid #ddd;border-radius:12px;width:100%}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.hero>*{animation:fi .8s both}.hero>*:nth-child(2){animation-delay:.2s}@keyframes fi{from{opacity:0;transform:translateY(16px)}}
footer{border-top:1px solid var(--bd);padding:28px 0;text-align:center;color:var(--mu);font-size:.85rem}
#adm{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:none}
#pn{position:fixed;inset:0;z-index:40;background:#fff;overflow:auto;display:none;padding:20px}
#pn .w{max-width:760px}#pn fieldset{border:1px solid var(--bd);border-radius:14px;margin:0 0 16px;padding:14px}#pn legend{font-weight:600;color:var(--gd)}
#pn label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 2px}.row{display:grid;grid-template-columns:1.1fr 2fr .6fr auto auto;gap:6px;align-items:center;margin-bottom:6px}.row.v{grid-template-columns:1fr 1.4fr auto auto auto auto}
.row input{padding:7px 9px}.sm{padding:6px 10px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.hide{display:none!important}
@media(max-width:760px){.mn{position:absolute;top:60px;left:0;right:0;background:#fff;flex-direction:column;padding:0 20px;gap:0;max-height:0;overflow:hidden;transition:max-height .35s;border-bottom:1px solid var(--bd)}.mn.o{max-height:420px}.mn a{padding:12px 0}#hb{display:block}.hero,.ab{grid-template-columns:1fr}.row,.row.v{grid-template-columns:1fr 1fr}section{padding:48px 0}}

 vip:`<section id="vip"><div class="w"><div class="band rv">${V.banner?`<img src="${esc(V.banner)}" alt="VIP banner">`:''}<h2>JOIN THE ${esc(C.name)} VIP COMMUNITY</h2><p>${esc(V.text)}</p>${V.desc?`<p>${esc(V.desc)}</p>`:''}<p>${lk(V.invite,V.btn,'btn gold')} ${lk(V.chat,'Chat on WhatsApp')}</p>${V.phone?`<p style="margin:0;color:var(--mu)">WhatsApp: ${esc(V.phone)}</p>`:''}</div></div></section>`,
 videos:`<section id="videos"><div class="w"><h2>WATCH ${esc(C.name)} VIDEOS</h2><p class="sub">${safe(C.yt.channel)?lk(C.yt.channel,'Visit YouTube Channel','btn gold'):''}</p><div class="grid rv">${C.yt.vids.filter(v=>safe(v.u)).map(v=>`<a class="card vd" href="${esc(v.u)}" target="_blank" rel="noopener noreferrer"><div class="th">${v.th?`<img src="${esc(v.th)}" alt="" loading="lazy">`:'▶'}</div><h3>${esc(v.t||'Video')}</h3></a>`).join('')||'<p class="sub" style="grid-column:1/-1">Featured videos will appear here once added in Admin settings.</p>'}</div></div></section>`,
 about:`<section id="about"><div class="w"><h2>ABOUT ${esc(C.name)}</h2><div class="ab rv" style="margin-top:28px"><div class="pf">${photo}</div><div><p>${esc(C.about.text)}</p>${C.about.bio?`<p>${esc(C.about.bio)}</p>`:''}${C.about.creds?`<p><b>Experience &amp; education:</b> ${esc(C.about.creds)}</p>`:''}<div class="soc" style="justify-content:flex-start">${soc().slice(0,6).map(s=>`<a class="so" style="padding:8px" href="${esc(su(s))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.n)}">${I[s.k]||I.website}</a>`).join('')}</div></div></div></div></section>`,
 contact:`<section id="contact"><div class="w"><h2>CONTACT ${esc(C.name)}</h2><p class="sub">${lk(V.chat,'WhatsApp','btn gold')} ${C.contact.email?`<a class="btn" href="mailto:${esc(C.contact.email)}">${esc(C.contact.email)}</a>`:''}</p>${C.contact.form&&safe(V.chat)?`<form id="cf" novalidate><input name="n" placeholder="Your name" required maxlength="80"><input name="e" type="email" placeholder="Your email" required maxlength="120"><textarea name="m" rows="4" placeholder="Message" required maxlength="1000"></textarea><button class="btn gold" type="submit">Send via WhatsApp</button><small id="fe" style="color:#b00"></small></form>`:''}</div></div></section>`};
 const on=C.sec.filter(s=>s.on&&T[s.id]);
 $('#main').innerHTML=on.map(s=>T[s.id]).join('');
 $('#mn').innerHTML=on.filter(s=>NAV[s.id]&&s.id!=='hl').map(s=>`<a href="#${s.id}">${NAV[s.id]}</a>`).join('');
 const cf=$('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();const f=new FormData(cf),n=f.get('n').trim(),m=f.get('m').trim(),em=f.get('e').trim();
  if(!n||!m||!/^\S+@\S+\.\S+$/.test(em)){$('#fe').textContent='Please enter your name, a valid email and a message.';return}
  $('#fe').textContent='';const b=V.chat+(V.chat.includes('?')?'&':'?')+'text='+encodeURIComponent(`Hi, I'm ${n} (${em}). ${m}`);window.open(b,'_blank','noopener')};
 observe();
}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(x=>io.observe(x))}
$('#hb').onclick=()=>{const o=$('#mn').classList.toggle('o');$('#hb').setAttribute('aria-expanded',o)};
$('#mn').onclick=()=>{$('#mn').classList.remove('o')};
// ---- Admin
const inp=(l,p,v)=>`<label>${l}</label><input data-p="${p}" value="${esc(v)}">`;
const up=(l,p)=>`<label>${l}</label><input type="file" accept="image/*" data-up="${p}"><small>${assets?'':'Uploads unavailable in this view'}</small>`;
function panel(){let h='';
 h+=`<fieldset><legend>General</legend>${inp('Website name','name',C.name)}${up('Logo upload','logo')}${up('Profile photo upload','photo')}${inp('Hero title','hero.title',C.hero.title)}${inp('Hero headline','hero.head',C.hero.head)}${inp('Hero description','hero.text',C.hero.text)}${inp('Hero button 1 label','hero.b1',C.hero.b1)}${inp('Hero button 2 label','hero.b2',C.hero.b2)}</fieldset>`;
 h+=`<fieldset><legend>Highlights (text only — no invented stats)</legend>${C.hl.map((x,i)=>inp('Title '+(i+1),'hl.'+i+'.t',x.t)+inp('Text','hl.'+i+'.d',x.d)).join('')}</fieldset>`;
 h+=`<fieldset><legend>Trading education / courses</legend>${['title','text'].map(k=>inp(k,'edu.'+k,C.edu[k])).join('')}${up('Course banner','edu.banner')}${[1,2,3].map(n=>inp('Button '+n+' label','edu.b'+n,C.edu['b'+n])+inp('Button '+n+' URL','edu.u'+n,C.edu['u'+n])).join('')}</fieldset>`;
 h+=`<fieldset><legend>Social links (empty URL = hidden)</legend>${C.soc.map((s,i)=>`<div class="row"><input data-p="soc.${i}.l" value="${esc(s.l)}" aria-label="Label"><input data-p="soc.${i}.u" value="${esc(s.u)}" placeholder="${esc(s.n)} URL" aria-label="URL"><input data-p="soc.${i}.o" type="number" value="${s.o}" aria-label="Order"><label style="margin:0"><input type="checkbox" data-p="soc.${i}.on" ${s.on?'checked':''} style="width:auto"> on</label></div>`).join('')}</fieldset>`;
 h+=`<fieldset><legend>VIP group &amp; WhatsApp</legend>${inp('Button label','vip.btn',C.vip.btn)}${inp('Description','vip.text',C.vip.text)}${inp('Extra description','vip.desc',C.vip.desc)}${inp('WhatsApp group/channel invitation link','vip.invite',C.vip.invite)}${inp('WhatsApp number (shown)','vip.phone',C.vip.phone)}${inp('WhatsApp direct chat link','vip.chat',C.vip.chat)}${up('VIP banner','vip.banner')}</fieldset>`;
 h+=`<fieldset><legend>YouTube</legend>${inp('Channel URL','yt.channel',C.yt.channel)}<div id="vl">${C.yt.vids.map((v,i)=>`<div class="row v"><input data-p="yt.vids.${i}.t" value="${esc(v.t)}" placeholder="Title"><input data-p="yt.vids.${i}.u" value="${esc(v.u)}" placeholder="Video URL"><button class="sm" data-a="up${i}">↑</button><button class="sm" data-a="dn${i}">↓</button><button class="sm" data-a="rm${i}">✕</button><input type="file" accept="image/*" data-up="yt.vids.${i}.th" title="Thumbnail"></div>`).join('')}</div><button class="sm" data-a="add">+ Add video</button></fieldset>`;
 h+=`<fieldset><legend>About &amp; contact</legend>${inp('About text','about.text',C.about.text)}${inp('Biography','about.bio',C.about.bio)}${inp('Real experience / qualifications (leave blank if none)','about.creds',C.about.creds)}${inp('Contact email','contact.email',C.contact.email)}<label><input type="checkbox" data-p="contact.form" ${C.contact.form?'checked':''} style="width:auto"> Show contact form</label></fieldset>`;
 h+=`<fieldset><legend>Sections (order &amp; visibility)</legend>${C.sec.map((s,i)=>`<div class="row v" style="grid-template-columns:auto 1fr auto auto"><input type="checkbox" data-p="sec.${i}.on" ${s.on?'checked':''} style="width:auto"><span>${s.id}</span><button class="sm" data-a="su${i}">↑</button><button class="sm" data-a="sd${i}">↓</button></div>`).join('')}</fieldset>`;
 $('#pf').innerHTML=h}
function setp(p,v){const k=p.split('.');let o=C;for(let i=0;i<k.length-1;i++)o=o[k[i]];const l=k[k.length-1];o[l]=typeof o[l]==='number'?Number(v):v}
$('#pf').addEventListener('input',e=>{const t=e.target;if(t.dataset.p)setp(t.dataset.p,t.type==='checkbox'?(t.checked?1:0):t.value)});
$('#pf').addEventListener('change',e=>{const t=e.target;if(!t.dataset.up||!t.files[0])return;const f=t.files[0];if(!f.type.startsWith('image/')){$('#ms').textContent='Please choose an image file';return}const r=new FileReader();r.onload=()=>{setp(t.dataset.up,r.result);$('#ms').textContent='Image ready — press Save'};r.onerror=()=>{$('#ms').textContent='Could not read image'};r.readAsDataURL(f)});
$('#pf').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const mv=(arr,i,d)=>{const j=i+d;if(j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]]};const n=+a.slice(2);
 if(a==='add')C.yt.vids.push({t:'',u:'',th:''});else if(a[0]==='u'&&a[1]==='p')mv(C.yt.vids,n,-1);else if(a.startsWith('dn'))mv(C.yt.vids,n,1);else if(a.startsWith('rm'))C.yt.vids.splice(n,1);else if(a.startsWith('su'))mv(C.sec,n,-1);else if(a.startsWith('sd'))mv(C.sec,n,1);panel()});
$('#sv').onclick=()=>{try{localStorage.setItem('urtrader_site_config',JSON.stringify(C));$('#ms').textContent='Saved on this browser ✓';render()}catch(x){$('#ms').textContent='Save failed — image may be too large. Try a smaller image.'}};
$('#cl').onclick=()=>{$('#pn').style.display='none';render()};
$('#adm').onclick=()=>{panel();$('#pn').style.display='block'};
const merge=(a,b)=>{for(const k in b){if(Array.isArray(b[k])&&k!=='vids')a[k]=b[k].map((x,i)=>typeof x==='object'&&a[k]&&a[k][i]?Object.assign({},a[k][i],x):x);else if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])merge(a[k],b[k]);else a[k]=b[k]}};
$('#adm').style.display='inline-flex';
try{const saved=localStorage.getItem('urtrader_site_config');if(saved)merge(C,JSON.parse(saved))}catch(e){console.warn('Could not load saved site settings',e)}
render();
</script></body></html>
